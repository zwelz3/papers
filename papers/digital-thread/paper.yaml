slug: digital-thread
title: Exploring the ontological digital thread
subtitle: What a thread is, what it is not, and how relationships compose into a process
description: >
  A working note that separates the atomic digital thread (a typed, addressable,
  provenance-bearing assertion between two information elements) from the
  connected graph those assertions form, and from the pipelines, APIs, and
  workflows that merely realize them. Maps a traceability example onto the
  distinction and proposes a cleaner cut.
