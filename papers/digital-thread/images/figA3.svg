<svg class="dfig" viewBox="0 0 720 244" role="img" aria-label="Three states of ASoT realization: asserted authority, realizable authority, and realized authority, with realization triggered by traversal"><defs><marker id="aG-a3" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#54626E"/></marker><marker id="aGs-a3" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><polygon points="8,0 0,4 8,8" fill="#54626E"/></marker><marker id="aI-a3" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#3B47A0"/></marker><marker id="aT-a3" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#0E7C86"/></marker><marker id="aA-a3" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#B26A0F"/></marker></defs>
      <rect x="14" y="64" width="168" height="86" rx="4" fill="#f5e9d6" stroke="#B26A0F" stroke-width="1.5"/>
      <text x="98" y="90" text-anchor="middle" font-family="Calibri, sans-serif" font-weight="700" font-size="11" fill="#8a5410">Asserted authority</text>
      <text x="98" y="110" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="8.5" fill="#141E27">governance metadata:</text>
      <text x="98" y="124" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="8.5" fill="#141E27">node is ASoT for fact F</text>
      <text x="98" y="140" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="8" fill="#6b7785">always present</text>
      <line x1="182" y1="107" x2="274" y2="107" stroke="#B26A0F" stroke-width="1.4" marker-end="url(#aA-a3)"/>
      <text x="228" y="99" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="8" fill="#54626E">declared</text>
      <rect x="276" y="64" width="168" height="86" rx="4" fill="#fff" stroke="#B26A0F" stroke-width="1.5" stroke-dasharray="5 3"/>
      <text x="360" y="90" text-anchor="middle" font-family="Calibri, sans-serif" font-weight="700" font-size="11" fill="#8a5410">Realizable authority</text>
      <text x="360" y="110" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="8.5" fill="#141E27">the thread can produce</text>
      <text x="360" y="123" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="8.5" fill="#141E27">the value; not yet</text>
      <text x="360" y="137" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="8" fill="#6b7785">virtual / federated</text>
      <line x1="444" y1="107" x2="536" y2="107" stroke="#B26A0F" stroke-width="2" marker-end="url(#aA-a3)"/>
      <text x="490" y="97" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="8" fill="#8a5410">realization event</text>
      <text x="490" y="123" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="7.5" fill="#54626E">query &#183; API &#183; run</text>
      <rect x="538" y="64" width="168" height="86" rx="4" fill="#f5e9d6" stroke="#B26A0F" stroke-width="1.5"/>
      <text x="622" y="90" text-anchor="middle" font-family="Calibri, sans-serif" font-weight="700" font-size="11" fill="#8a5410">Realized authority</text>
      <text x="622" y="110" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="8.5" fill="#141E27">value materialized,</text>
      <text x="622" y="123" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="8.5" fill="#141E27">carries provenance</text>
      <text x="622" y="137" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="8" fill="#6b7785">of the traversal</text>
      <text x="360" y="188" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="9.5" fill="#141E27">The ASoT role is realized by the process in which the authoritative value is produced and used.</text>
      <text x="360" y="208" text-anchor="middle" font-family="Cambria, Georgia, serif" font-style="italic" font-size="8.5" fill="#54626E">To baseline: force realization once, then freeze and provenance the snapshot.</text>
    </svg>