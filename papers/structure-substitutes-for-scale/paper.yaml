slug: structure-substitutes-for-scale
title: Structure Substitutes for Scale
subtitle: Meta-problem solving, the trialogue, and knowledge-graph-mediated tool provisioning
description: >
  A concept paper arguing that tool knowledge belongs in a governable knowledge
  graph outside the model, that agentic intelligence lives in the traversal
  policy over that structure, and that graph-mediated provisioning should
  flatten the gap between frontier and sub-billion-parameter models. Ends with
  a preregistered, falsifiable experiment.
