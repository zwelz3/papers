slug: uaf-rdf-future-of-mbse
title: Thoughts on UAF, RDF, and the Future of MBSE
subtitle: Two complementary pillars of digital engineering, and why their compatibility is not implicit
description: >
  A diagnosis of the design gap between UAF/UAFML's MOF-based, closed-world
  metamodel paradigm and RDF's open-world semantic paradigm: where they
  conflict (identity, semantics, n-ary relations, implicit view context),
  why UAF 1.2 models behave like legacy data silos, and where a combined
  approach can still pay off.
