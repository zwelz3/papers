slug: beyond-diagramming-software
title: Beyond Expensive Diagramming Software
subtitle: Digital engineering's next evolution is model-generated engineering
description: >
  The fair criticism of digital engineering (Visio replaced by costlier
  tools, models maintained as one more deliverable) points at the wrong
  unit of value. When the semantic model is the authoritative asset,
  traceability matrices become stored queries, ICDs and review packages
  become generated provenance-carrying views, and compliance becomes SHACL
  validation output; with an accounting of the contractual, CM, and skills
  friction standing in the way.
