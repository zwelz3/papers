<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="gen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6f7b5e"/>
    </marker>
  </defs>

  <!-- hub -->
  <rect x="330" y="228" width="280" height="104" rx="12" fill="#eef0e9" stroke="#6f7b5e" stroke-width="2"/>
  <text x="470" y="262" fill="#33332f" font-size="16.5" font-weight="600" text-anchor="middle">Semantic engineering model</text>
  <text x="470" y="284" fill="#5a5a56" font-size="13.5" text-anchor="middle">authoritative source of truth</text>
  <text x="470" y="304" fill="#5a5a56" font-size="13.5" text-anchor="middle">each fact exists exactly once</text>

  <!-- validation gate -->
  <rect x="360" y="196" width="220" height="26" rx="13" fill="#f6f5f1" stroke="#8a8a84" stroke-width="1.3"/>
  <text x="470" y="214" fill="#5a5a56" font-size="12.5" text-anchor="middle">SHACL validation gates every projection</text>

  <!-- generated projections -->
  <g stroke="#8a8a84" stroke-width="1.3" fill="#f6f5f1">
    <rect x="30"  y="60"  width="196" height="52" rx="9"/>
    <rect x="30"  y="254" width="196" height="52" rx="9"/>
    <rect x="30"  y="448" width="196" height="52" rx="9"/>
    <rect x="714" y="60"  width="196" height="52" rx="9"/>
    <rect x="714" y="254" width="196" height="52" rx="9"/>
    <rect x="714" y="448" width="196" height="52" rx="9"/>
  </g>
  <g fill="#33332f" font-size="14" text-anchor="middle">
    <text x="128" y="82">Traceability matrix</text><text x="128" y="100" font-size="12.5" fill="#77776f">a stored query</text>
    <text x="128" y="276">Interface control document</text><text x="128" y="294" font-size="12.5" fill="#77776f">an interface view</text>
    <text x="128" y="470">Architecture diagrams</text><text x="128" y="488" font-size="12.5" fill="#77776f">notation projections</text>
    <text x="812" y="82">Verification report</text><text x="812" y="100" font-size="12.5" fill="#77776f">an evidence traversal</text>
    <text x="812" y="276">Review package</text><text x="812" y="294" font-size="12.5" fill="#77776f">the baseline, rendered</text>
    <text x="812" y="470">Compliance evidence</text><text x="812" y="488" font-size="12.5" fill="#77776f">conformance results</text>
  </g>

  <!-- generation arrows outward -->
  <g stroke="#6f7b5e" stroke-width="1.6" fill="none" marker-end="url(#gen)">
    <path d="M 342 240 C 300 200, 270 150, 230 104"/>
    <path d="M 326 280 L 230 280"/>
    <path d="M 342 320 C 300 360, 270 410, 230 456"/>
    <path d="M 598 240 C 640 200, 670 150, 710 104"/>
    <path d="M 614 280 L 710 280"/>
    <path d="M 598 320 C 640 360, 670 410, 710 456"/>
  </g>
  <g fill="#6f7b5e" font-size="12.5" font-style="italic" text-anchor="middle">
    <text x="262" y="176">generated</text>
    <text x="262" y="272">generated</text>
    <text x="262" y="404">generated</text>
    <text x="678" y="176">generated</text>
    <text x="678" y="272">generated</text>
    <text x="678" y="404">generated</text>
  </g>

  <!-- provenance note -->
  <rect x="330" y="356" width="280" height="26" rx="13" fill="#f6f5f1" stroke="#8a8a84" stroke-width="1.3"/>
  <text x="470" y="374" fill="#5a5a56" font-size="12.5" text-anchor="middle">every rendering carries provenance (PROV-O)</text>

  <text x="470" y="540" fill="#77776f" font-size="13.5" text-anchor="middle">Artifacts as regenerable views over the model: queried on demand, validated on the way out, never edited by hand.</text>
</svg>
