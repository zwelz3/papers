<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5a5a56"/>
    </marker>
    <marker id="arr-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b0562e"/>
    </marker>
  </defs>

  <!-- artifact chain -->
  <g stroke="#8a8a84" stroke-width="1.4" fill="#f6f5f1">
    <rect x="18"  y="150" width="128" height="56" rx="9"/>
    <rect x="176" y="150" width="128" height="56" rx="9" fill="#eef0e9" stroke="#6f7b5e" stroke-width="1.8"/>
    <rect x="334" y="150" width="128" height="56" rx="9"/>
    <rect x="492" y="150" width="128" height="56" rx="9"/>
    <rect x="650" y="150" width="128" height="56" rx="9"/>
    <rect x="808" y="150" width="118" height="56" rx="9"/>
  </g>
  <g fill="#33332f" font-size="14.5" text-anchor="middle">
    <text x="82"  y="173">Requirements</text><text x="82"  y="191">database</text>
    <text x="240" y="173">SysML</text><text x="240" y="191">model</text>
    <text x="398" y="173">PowerPoint</text><text x="398" y="191">decks</text>
    <text x="556" y="173">Word</text><text x="556" y="191">documents</text>
    <text x="714" y="173">Excel</text><text x="714" y="191">matrices</text>
    <text x="867" y="173">Review</text><text x="867" y="191">package</text>
  </g>
  <g stroke="#5a5a56" stroke-width="1.6" marker-end="url(#arr)">
    <line x1="146" y1="178" x2="172" y2="178"/>
    <line x1="304" y1="178" x2="330" y2="178"/>
    <line x1="462" y1="178" x2="488" y2="178"/>
    <line x1="620" y1="178" x2="646" y2="178"/>
    <line x1="778" y1="178" x2="804" y2="178"/>
  </g>

  <!-- manual re-synchronization arcs -->
  <g stroke="#b0562e" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <path d="M 240 148 C 300 70, 500 70, 552 146" marker-end="url(#arr-sync)"/>
    <path d="M 250 146 C 380 40, 620 40, 710 146" marker-end="url(#arr-sync)"/>
    <path d="M 262 144 C 460 8,  760 8,  862 144" marker-end="url(#arr-sync)"/>
    <path d="M 398 210 C 470 280, 640 280, 710 212" marker-end="url(#arr-sync)"/>
    <path d="M 560 212 C 660 290, 800 290, 864 212" marker-end="url(#arr-sync)"/>
  </g>
  <text x="470" y="34" fill="#b0562e" font-size="14" text-anchor="middle" font-style="italic">every change re-synchronized by hand</text>

  <text x="240" y="240" fill="#6f7b5e" font-size="13.5" text-anchor="middle">one deliverable among many</text>
  <text x="470" y="316" fill="#77776f" font-size="13.5" text-anchor="middle">The model joins the artifact chain instead of replacing it; each hop is a manual copy that can drift.</text>
</svg>
