slug: beyond-models-as-code
title: Beyond Models as Code
subtitle: The Diminishing Case for Traditional MBSE in the Age of LLMs and Semantic Technologies
description: >
  SysML v2's "models as code" turn is directionally sound but may not go far
  enough. General-purpose languages, LLMs as the translation layer, and RDF
  technologies as the ontological foundation suggest an inverted "code as
  models" paradigm that dissolves MBSE as a distinct technical discipline,
  leaving the institutional case as its strongest remaining defense.
