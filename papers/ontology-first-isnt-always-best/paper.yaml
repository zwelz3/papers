slug: ontology-first-isnt-always-best
title: Why "Ontology First" Knowledge Systems Are Not Always Best
subtitle: Federated, incremental integration with OWL + SHACL, demonstrated end to end
description: >
  Why a comprehensive up-front enterprise ontology becomes a choke point, and
  how a federated incremental approach (ontology as bridge language, SHACL as
  validation instead of prescription) integrates as-is data sources. Includes
  a worked demo where an RDBMS/GraphQL source and a loose Excel source share
  an ontology yet silently miss connections until SHACL exposes the mismatch,
  plus a candid accounting of the federated approach's own downsides.
