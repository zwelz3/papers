slug: sysml-v2-rdf-digital-thread
title: SysML v2, RDF, and an Open Digital Thread
subtitle: A dialogue on dividing responsibilities between MBSE and knowledge systems
description: >
  A question-and-answer exploration of the boundary between model-based
  systems engineering and semantic knowledge systems: motivating RDF as the
  digital thread substrate while keeping UML/SysML/UAF as the authoritative
  modeling layer, the OSLC "shape gap" that makes SHACL the necessary
  validation layer, and the UK IES ontology's pivot away from IDEAS as
  precedent for INCOSE DEIX.
