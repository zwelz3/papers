slug: rdf-hypergraphs-subsuming-lpg
title: The RDF vs. LPG Debate Is Quickly Becoming Irrelevant
subtitle: RDF is already a hypergraph system; the LPG is a projection inside it
description: >
  Named graphs make RDF a hypergraph in practice: observations, classifications,
  projections, provenance, and SHACL contracts coexist as graphs that are
  simultaneously containers and participants. The LPG structure that Neo4j and
  NetworkX need becomes just another named graph, validated by shapes before
  projection, and the format debate dissolves into a tooling problem.
