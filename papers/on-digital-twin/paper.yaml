slug: on-digital-twin
title: Digital Twin as Artifact and Role
subtitle: A Pattern for Digital Engineering Information Exchange
description: >
  The digital twin does not need another definition; it needs a structure.
  This paper separates the persistent digital twin artifact (an information
  content entity) from the contextual digital twin role it bears when
  realized in processes, grounded in the Common Core Ontologies, with RDF
  examples covering LVC modes, coupling, and data-source binding.
