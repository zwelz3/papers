<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A bare SPARQL query resolves against an empty default graph and returns nothing</title>
<desc>A quad store holds three populated named graphs — twelve triples in all. A query with no GRAPH clause is routed to the store's default graph, which is empty, so the query returns zero rows. A question mark marks the oddity: the data is in the store, but not where a bare triple pattern looks for it.</desc>
<defs>
<filter id="card" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0B1930" flood-opacity="0.09"/></filter>
<filter id="band" x="-12%" y="-40%" width="124%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0B1930" flood-opacity="0.16"/></filter>
</defs>
<rect width="1200" height="800" fill="#F5F2EA"/>

<!-- the query: a bare triple pattern, no GRAPH clause -->
<rect x="310" y="72" width="580" height="140" rx="20" fill="#14233A" filter="url(#band)"/>
<text x="600" y="134" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="27" font-weight="600" fill="#F2F6FC" text-anchor="middle">SELECT * WHERE { ?s ?p ?o }</text>
<text x="600" y="170" font-size="16" fill="#B7C7DE" text-anchor="middle">a bare triple pattern — no GRAPH clause</text>

<!-- with no GRAPH clause the pattern is routed to the default graph -->
<path d="M600 212 L600 234 L821 234 L821 249" fill="none" stroke="#3B47A0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M814 249 L821 262 L828 249 Z" fill="#3B47A0"/>

<!-- the quad store: named graphs full, default graph empty -->
<rect x="170" y="262" width="860" height="278" rx="20" fill="#FCFAF5" stroke="#A6AFBE" stroke-width="1.25" filter="url(#card)"/>
<text x="202" y="310" font-size="23" font-weight="700" fill="#141E27">quad store</text>
<text x="998" y="308" font-size="13" font-weight="700" letter-spacing="1.6" fill="#636D7A" text-anchor="end">12 TRIPLES STORED</text>
<path d="M202 330 L998 330" stroke="#CAD4DC" stroke-width="1"/>
<text x="202" y="364" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#636D7A">NAMED GRAPHS</text>
<text x="644" y="364" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#636D7A">DEFAULT GRAPH</text>

<rect x="202" y="378" width="118" height="116" rx="13" fill="#DCE3EE" stroke="#93A8C4" stroke-width="1.25"/>
<path d="M236 414 L286 404 L261 444 Z" fill="none" stroke="#8FA3BE" stroke-width="2" stroke-linejoin="round"/>
<circle cx="236" cy="414" r="6" fill="#3B47A0"/>
<circle cx="286" cy="404" r="6" fill="#3B47A0"/>
<circle cx="261" cy="444" r="6" fill="#3B47A0"/>
<text x="261" y="478" font-size="14.5" font-weight="600" fill="#1f3448" text-anchor="middle">:g1</text>

<rect x="334" y="378" width="118" height="116" rx="13" fill="#DCE3EE" stroke="#93A8C4" stroke-width="1.25"/>
<path d="M368 414 L418 404 L393 444 Z" fill="none" stroke="#8FA3BE" stroke-width="2" stroke-linejoin="round"/>
<circle cx="368" cy="414" r="6" fill="#3B47A0"/>
<circle cx="418" cy="404" r="6" fill="#3B47A0"/>
<circle cx="393" cy="444" r="6" fill="#3B47A0"/>
<text x="393" y="478" font-size="14.5" font-weight="600" fill="#1f3448" text-anchor="middle">:g2</text>

<rect x="466" y="378" width="118" height="116" rx="13" fill="#DCE3EE" stroke="#93A8C4" stroke-width="1.25"/>
<path d="M500 414 L550 404 L525 444 Z" fill="none" stroke="#8FA3BE" stroke-width="2" stroke-linejoin="round"/>
<circle cx="500" cy="414" r="6" fill="#3B47A0"/>
<circle cx="550" cy="404" r="6" fill="#3B47A0"/>
<circle cx="525" cy="444" r="6" fill="#3B47A0"/>
<text x="525" y="478" font-size="14.5" font-weight="600" fill="#1f3448" text-anchor="middle">:g3</text>

<rect x="644" y="378" width="354" height="116" rx="14" fill="#F5F2EA" stroke="#C0A268" stroke-width="1.75" stroke-dasharray="9 7"/>
<text x="821" y="446" font-size="28" font-weight="700" fill="#8a5410" text-anchor="middle">empty</text>

<!-- so nothing comes back -->
<path d="M821 540 L821 577" fill="none" stroke="#C0A268" stroke-width="2.4" stroke-dasharray="8 6" stroke-linecap="round"/>
<path d="M814 577 L821 590 L828 577 Z" fill="#C0A268"/>
<rect x="644" y="590" width="354" height="114" rx="16" fill="#ECE0C7" stroke="#C0A268" stroke-width="1.5"/>
<text x="821" y="652" font-size="40" font-weight="700" fill="#8a5410" text-anchor="middle">0 rows</text>
<text x="821" y="682" font-size="15" fill="#54626E" text-anchor="middle">no bindings returned</text>

<circle cx="522" cy="647" r="54" fill="#FCFAF5" stroke="#C0A268" stroke-width="2" stroke-dasharray="10 8"/>
<text x="522" y="676" font-size="82" font-weight="700" fill="#8a5410" text-anchor="middle">?</text>

<text x="202" y="638" font-size="18" fill="#54626E">The store isn’t empty.</text>
<text x="202" y="666" font-size="18" font-weight="600" fill="#141E27">Its default graph is.</text>
</svg>
