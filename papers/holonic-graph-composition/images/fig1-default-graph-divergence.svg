<path d="M988 200 L988 214" stroke="#3B47A0" stroke-width="2.2" stroke-linecap="round"/>
<path d="M983 214 L988 224 L993 214 Z" fill="#3B47A0"/>

<rect x="36" y="224" width="352" height="316" rx="18" fill="#fff" stroke="#A6AFBE" stroke-width="1.25" filter="url(#card)"/>
<text x="64" y="270" font-size="24" font-weight="700" fill="#141E27">Fuseki</text>
<text x="64" y="298" font-size="17" fill="#6b7785">union mode</text>
<path d="M64 320 L360 320" stroke="#CAD4DC" stroke-width="1"/>
<text x="64" y="354" font-size="16" fill="#54626E">tdb2:unionDefaultGraph true</text>
<text x="64" y="380" font-size="13" font-weight="700" fill="#6b7785" letter-spacing="2">DEFAULT GRAPH</text>
<text x="64" y="410" font-size="19" font-weight="500" fill="#141E27">union of A and B</text>
<rect x="64" y="450" width="296" height="60" rx="14" fill="#ECE0C7" stroke="#C0A268" stroke-width="1.25"/>
<text x="212" y="489" font-size="26" font-weight="700" fill="#8a5410" text-anchor="middle">8 rows</text>

<rect x="424" y="224" width="352" height="316" rx="18" fill="#fff" stroke="#A6AFBE" stroke-width="1.25" filter="url(#card)"/>
<text x="452" y="270" font-size="24" font-weight="700" fill="#141E27">GraphDB</text>
<text x="452" y="298" font-size="17" fill="#6b7785">empty by default</text>
<path d="M452 320 L748 320" stroke="#CAD4DC" stroke-width="1"/>
<text x="452" y="354" font-size="16" fill="#54626E">no union setting to turn on</text>
<text x="452" y="380" font-size="13" font-weight="700" fill="#6b7785" letter-spacing="2">DEFAULT GRAPH</text>
<text x="452" y="410" font-size="19" font-weight="500" fill="#141E27">empty</text>
<rect x="452" y="450" width="296" height="60" rx="14" fill="#ECE0C7" stroke="#C0A268" stroke-width="1.25"/>
<text x="600" y="489" font-size="26" font-weight="700" fill="#8a5410" text-anchor="middle">0 rows</text>

<rect x="812" y="224" width="352" height="316" rx="18" fill="#fff" stroke="#A6AFBE" stroke-width="1.25" filter="url(#card)"/>
<text x="840" y="270" font-size="24" font-weight="700" fill="#141E27">Stardog</text>
<text x="840" y="298" font-size="17" fill="#6b7785">configurable</text>
<path d="M840 320 L1136 320" stroke="#CAD4DC" stroke-width="1"/>
<text x="840" y="354" font-size="16" fill="#54626E">query.all.graphs decides</text>
<text x="840" y="380" font-size="13" font-weight="700" fill="#6b7785" letter-spacing="2">DEFAULT GRAPH</text>
<text x="840" y="410" font-size="19" font-weight="500" fill="#141E27">deployment choice</text>
<rect x="840" y="450" width="296" height="60" rx="14" fill="#ECE0C7" stroke="#C0A268" stroke-width="1.25"/>
<text x="988" y="489" font-size="26" font-weight="700" fill="#8a5410" text-anchor="middle">0 or 8 rows</text>
</svg>
