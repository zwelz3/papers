<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<defs>
<filter id="card" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0B1930" flood-opacity="0.09"/></filter>
<filter id="band" x="-12%" y="-40%" width="124%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0B1930" flood-opacity="0.16"/></filter>
</defs>
<rect x="0" y="0" width="1200" height="580" fill="#FAFBFC"/>

<rect x="320" y="32" width="560" height="144" rx="20" fill="#14233A" filter="url(#band)"/>
<text x="600" y="78" font-size="26" font-weight="700" fill="#F2F6FC" text-anchor="middle">SELECT * WHERE { ?s ?p ?o }</text>
<text x="600" y="106" font-size="17" fill="#B7C7DE" text-anchor="middle">A bare triple pattern, no GRAPH clause</text>
<rect x="414" y="120" width="178" height="36" rx="11" fill="#DCE3EE" stroke="#93A8C4" stroke-width="1"/>
<text x="503" y="144" font-size="16" font-weight="600" fill="#141E27" text-anchor="middle">Graph A · 3 triples</text>
<rect x="608" y="120" width="178" height="36" rx="11" fill="#DCE3EE" stroke="#93A8C4" stroke-width="1"/>
<text x="697" y="144" font-size="16" font-weight="600" fill="#141E27" text-anchor="middle">Graph B · 5 triples</text>

<path d="M600 176 L600 200" stroke="#3B47A0" stroke-width="2.2" stroke-linecap="round"/>
<path d="M212 200 L988 200" stroke="#3B47A0" stroke-width="2.2" stroke-linecap="round"/>
<path d="M212 200 L212 214" stroke="#3B47A0" stroke-width="2.2" stroke-linecap="round"/>
<path d="M207 214 L212 224 L217 214 Z" fill="#3B47A0"/>
